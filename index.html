<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 자리배치</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-color: #03dac6;
            --disabled-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="number"], textarea {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 80px;
            resize: vertical;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-create {
            background-color: var(--secondary-color);
            color: #000;
        }

        .btn-random {
            background-color: var(--accent-color);
            color: #000;
            width: 100%;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* 교실 화면 */
        .classroom {
            display: grid;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
            justify-content: center;
            perspective: 1000px;
        }

        .seat {
            background-color: var(--card-bg);
            border: 2px solid #333;
            border-radius: 12px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .seat:hover {
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .seat.disabled {
            background-color: #1a1a1a;
            border-color: #222;
            opacity: 0.5;
            cursor: default;
        }

        .seat.disabled::after {
            content: "X";
            font-size: 2rem;
            color: #444;
            position: absolute;
        }

        .seat-number {
            font-size: 0.8rem;
            color: var(--secondary-color);
            position: absolute;
            top: 8px;
            left: 10px;
            font-weight: bold;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            text-align: center;
            word-break: keep-all;
        }

        .info-text {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 5px;
        }
        
        .divider {
            width: 100%;
            height: 1px;
            background-color: #333;
            margin: 10px 0;
        }

    </style>
</head>
<body>

    <h1>🏫 랜덤 자리 배치기</h1>

    <div class="container">
        <div class="controls">
            <div class="input-group">
                <label>가로(열)</label>
                <input type="number" id="cols" value="5" min="1">
            </div>
            <div class="input-group">
                <label>세로(행)</label>
                <input type="number" id="rows" value="6" min="1">
            </div>
            <button class="btn-create" onclick="createGrid()">책상 배치 만들기</button>
            
            <div class="divider"></div>

            <div class="input-group" style="width: 100%;">
                <label>학생 명단 (콤마나 엔터로 구분)</label>
                <textarea id="studentNames" placeholder="예: 박영수, 박주연, 홍지혜...">박영수, 박주연, 홍지혜, 백광일, 구태영, 서민영, 이영춘, 위광현, 이진우, 임영기, 전인호, 최수형</textarea>
                <p class="info-text">💡 팁: 제외할 학생은 명단에서 지우고, 사용하지 않을 책상은 아래에서 클릭해서 끄세요(X).</p>
            </div>

            <button class="btn-random" onclick="startRandom()">🎲 자리 추첨 시작!</button>
        </div>

        <div id="classroom" class="classroom"></div>
    </div>

    <script>
        let isAnimating = false;

        // 1. 초기 그리드 생성
        function createGrid() {
            const cols = document.getElementById('cols').value;
            const rows = document.getElementById('rows').value;
            const classroom = document.getElementById('classroom');
            
            classroom.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            classroom.innerHTML = ''; // 기존 내용 초기화

            for (let i = 0; i < cols * rows; i++) {
                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.dataset.index = i;
                
                // 클릭 시 사용 불가(X) 토글
                seat.onclick = function() {
                    if(!isAnimating) {
                        this.classList.toggle('disabled');
                    }
                };
                
                classroom.appendChild(seat);
            }
        }

        // 2. 랜덤 섞기 알고리즘 (Fisher-Yates Shuffle)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 3. 실행 로직
        function startRandom() {
            if(isAnimating) return;

            const seats = document.querySelectorAll('.seat');
            const activeSeats = [];
            
            // 사용 가능한(disabled가 아닌) 자리만 수집
            seats.forEach((seat, index) => {
                // 초기화
                seat.querySelector('.seat-number')?.remove();
                seat.querySelector('.student-name')?.remove();
                
                if (!seat.classList.contains('disabled')) {
                    activeSeats.push(seat);
                }
            });

            // 학생 명단 파싱
            const rawText = document.getElementById('studentNames').value;
            // 콤마, 줄바꿈, 공백 등을 기준으로 쪼개고 빈값 제거
            let students = rawText.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

            if (students.length > activeSeats.length) {
                alert(`자리가 부족합니다!\n학생 수: ${students.length}명\n사용 가능 자리: ${activeSeats.length}개`);
                return;
            }

            // --- 핵심 로직: 2단계 랜덤 ---

            // Step 1: 자리 번호 랜덤 생성
            // 1부터 사용 가능한 자리 개수만큼 숫자를 만들고 섞음
            let seatNumbers = Array.from({length: activeSeats.length}, (_, i) => i + 1);
            shuffle(seatNumbers);

            // Step 2: 학생 명단 섞기
            shuffle(students);

            // 애니메이션 효과 (선택사항)
            isAnimating = true;
            let count = 0;
            
            // 시각적 효과를 위해 약간의 딜레이
            activeSeats.forEach((seat, i) => {
                setTimeout(() => {
                    // 1. 랜덤한 자리 번호 부여
                    const numberDiv = document.createElement('div');
                    numberDiv.className = 'seat-number';
                    numberDiv.innerText = seatNumbers[i]; // 섞인 번호 부여
                    seat.appendChild(numberDiv);

                    // 2. 랜덤한 학생 부여 (학생이 자리보다 적을 수 있음)
                    if (i < students.length) {
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'student-name';
                        nameDiv.innerText = students[i];
                        seat.appendChild(nameDiv);
                    } else {
                        // 학생이 모자라면 빈자리 표시
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'student-name';
                        nameDiv.style.opacity = "0.3";
                        nameDiv.innerText = "(빈자리)";
                        seat.appendChild(nameDiv);
                    }
                    
                    // 등장 효과
                    seat.style.transform = "scale(1.05)";
                    setTimeout(() => seat.style.transform = "scale(1)", 200);

                }, i * 50); // 순차적으로 촤라락 뜨게 함
            });

            setTimeout(() => {
                isAnimating = false;
            }, activeSeats.length * 50 + 200);
        }

        // 페이지 로드 시 그리드 한번 생성
        window.onload = createGrid;
    </script>
</body>
</html>
